apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "urumi.labels" . | nindent 8 }}
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.mongoSecret }}
                  key: MONGO_URI
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: CREDENTIAL_ENCRYPTION_KEY
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: SESSION_SECRET
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: BOOTSTRAP_ADMIN_EMAIL
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: BOOTSTRAP_ADMIN_PASSWORD
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.existingSecret }}
                  key: LLM_API_KEY
            - name: COOKIE_SECURE
              value: {{ .Values.gateway.cookieSecure | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.gateway.llm.provider | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.gateway.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.gateway.llm.model | quote }}
            - name: LLM_MODELS
              value: {{ join "," .Values.gateway.llm.models | quote }}
            - name: UPSTREAM_LIST_TIMEOUT_MS
              value: {{ .Values.gateway.timeouts.listMs | quote }}
            - name: UPSTREAM_CALL_TIMEOUT_MS
              value: {{ .Values.gateway.timeouts.callMs | quote }}
            - name: HEALTH_CHECK_INTERVAL_MS
              value: {{ .Values.gateway.timeouts.healthIntervalMs | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ printf "%s://app.%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.global.domain | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: app.{{ .Values.global.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - app.{{ .Values.global.domain }}
      secretName: urumi-app-tls
  {{- end }}
