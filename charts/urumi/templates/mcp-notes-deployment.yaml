apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-notes
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/name: mcp-notes
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.mcpNotes.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-notes
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "urumi.labels" . | nindent 8 }}
        app.kubernetes.io/name: mcp-notes
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-notes
          image: "{{ .Values.mcpNotes.image.repository }}:{{ .Values.mcpNotes.image.tag }}"
          imagePullPolicy: {{ .Values.mcpNotes.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3003"
            - name: UPSTREAM_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urumi-mcp-notes
                  key: UPSTREAM_AUTH_TOKEN
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcpNotes.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-notes
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/name: mcp-notes
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3003
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: mcp-notes
    app.kubernetes.io/instance: {{ .Release.Name }}
